{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h2>Shopping Bag</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                {% if bag_items %}
                    <div class="table-responsive">

                    </div>
                {% else %}
                    <p>Your shopping bag is currently empty.</p>
                    <a href="{% url 'home' %}"></a>
                    <span class="icon">
                            <i class="fas fa-chevron-left"></i>
                    </span>
                    <span>Back Home</span>
                {% endif %}
            </div>
        </div>
    </div>
{% endblock %}
