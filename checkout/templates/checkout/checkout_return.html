{% extends "base.html" %}
{% load static %}


{% block page_header %}
    <div class="container header-container">
        <div class="row">
            <div class="col"></div>
        </div>
    </div>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row my-5">
        <div class="col-12 text-center">
            <h2 class="my-4 spacing-2">Payment successful!</h2>
            <p>Confirming your order...</p>
            <span class="loader"></span>
        </div>
    </div>
    <input
        type="hidden"
        id="payment-intent"
        value="{{ payment_intent }}"
    >
</div>
{% endblock %}

{% block postload_js %}
    <script>
        const checkOrderUrl = "{% url 'check_order' %}";
        const successUrl = "{% url 'checkout_return' %}";
    </script>
    <script src="{% static 'checkout/js/order_check.js' %}"></script>
{% endblock %}
