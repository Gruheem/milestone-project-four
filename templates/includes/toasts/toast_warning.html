<div class="toast custom-toast rounded-0 border-0" data-autohide="false">
    <div class="arrow-up arrow-warning"></div>
    <div class="w-100 toast-topper bg-warning"></div>
    <div class="toast-header bg-white text-dark d-flex justify-content-between border-0">
        <strong class="mr-auto">Warning!</strong>
        <button type="button" class="btn-close text-dark float-end" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body bg-white">
        {{ message }}
    </div>
</div>
